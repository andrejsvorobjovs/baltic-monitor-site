<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192"
     role="img" aria-label="Baltic Signal Monitor">
  <title>Baltic Signal Monitor</title>
  <!--
    Maskable / adaptive-icon cut for Android.

    Android crops a launcher icon to whatever shape the device theme uses
    - circle, squircle, rounded square - and only the middle 80% of the
    canvas is guaranteed to survive. The normal mark is a full-bleed disc,
    so that crop shaves its rim off on every device and leaves a ragged
    edge. Here the mark is scaled into the safe zone and the corners are
    filled with the badge colour, so whatever shape the launcher cuts, it
    cuts background and the disc stays whole.
  -->
  <defs>
    <radialGradient id="badge" cx="50%" cy="46%" r="62%">
      <stop offset="0%"   stop-color="#18232F"/>
      <stop offset="62%"  stop-color="#121924"/>
      <stop offset="100%" stop-color="#0D131C"/>
    </radialGradient>

    <!-- Sonar wash behind the target: the only "light" in the mark. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2C7877" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#2C7877" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2C7877" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim light, brighter at the top-left where the glow would fall. -->
    <linearGradient id="rim" x1="18%" y1="4%" x2="82%" y2="96%">
      <stop offset="0%"   stop-color="#31807E" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#1F5153" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F5153" stop-opacity="0.12"/>
    </linearGradient>

    <clipPath id="disc">
      <circle cx="96" cy="96" r="95.5"/>
    </clipPath>
  </defs>
  <rect width="192" height="192" fill="#0D131C"/>
  <g transform="translate(96 96) scale(0.78) translate(-96 -96)">
<!-- Badge -->
  <circle cx="96" cy="96" r="95.5" fill="url(#badge)"/>

  <g clip-path="url(#disc)">
    <!-- Sea silhouette, traced from the original raster. -->
    <path fill="#24323E" fill-opacity="0.92" d="M 81.00 34.80 C 83.74 33.94 87.67 33.85 91.00 34.80 C 94.33 35.75 98.80 38.48 101.00 40.51 C 103.20 42.54 103.37 43.69 104.20 47.00 C 105.04 50.31 103.20 56.88 106.00 60.34 C 108.80 63.81 117.09 65.17 121.00 67.78 C 124.91 70.39 127.26 73.30 129.46 76.00 C 131.66 78.70 132.88 81.00 134.20 84.00 C 135.53 87.00 136.89 90.33 137.43 94.00 C 137.97 97.67 138.47 101.33 137.43 106.00 C 136.40 110.67 134.25 117.33 131.22 122.00 C 128.19 126.67 123.35 131.17 119.25 134.00 C 115.14 136.83 109.81 135.29 106.60 139.00 C 103.39 142.71 101.77 152.67 100.00 156.26 C 98.23 159.84 97.50 159.46 96.00 160.49 C 94.50 161.52 93.17 162.15 91.00 162.43 C 88.83 162.72 85.21 162.77 83.00 162.20 C 80.79 161.63 79.10 160.20 77.73 159.00 C 76.36 157.80 75.81 157.17 74.78 155.00 C 73.75 152.83 71.96 149.50 71.57 146.00 C 71.17 142.50 72.47 136.67 72.42 134.00 C 72.37 131.33 71.71 131.33 71.27 130.00 C 70.82 128.67 70.80 127.00 69.77 126.00 C 68.74 125.00 66.21 125.00 65.07 124.00 C 63.93 123.00 63.97 122.33 62.93 120.00 C 61.88 117.67 59.69 113.33 58.80 110.00 C 57.90 106.67 57.57 103.33 57.57 100.00 C 57.57 96.67 58.00 93.00 58.80 90.00 C 59.60 87.00 62.69 85.83 62.36 82.00 C 62.02 78.17 57.57 70.50 56.81 67.00 C 56.05 63.50 57.18 62.83 57.80 61.00 C 58.42 59.17 58.43 58.33 60.54 56.00 C 62.65 53.67 68.13 49.67 70.46 47.00 C 72.79 44.33 72.78 42.03 74.54 40.00 C 76.30 37.97 78.26 35.67 81.00 34.80 Z"/>

    <!-- Sonar wash, centred on the target. -->
    <circle cx="100" cy="104" r="52" fill="url(#glow)"/>

    <!-- Target: two sonar rings, then the gold fix. -->
    <g fill="none" stroke-linecap="round">
      <circle cx="100" cy="104" r="30" stroke="#265E60" stroke-width="1.6"/>
      <circle cx="100" cy="104" r="20" stroke="#2C7877" stroke-width="2.4"/>
      <circle cx="100" cy="104" r="9.5" stroke="#D9B169" stroke-width="3"/>
    </g>
    <circle cx="100" cy="104" r="3.6" fill="#FAC873"/>
  </g>

  <!-- Outer ring, drawn last so it stays crisp over everything. -->
  <circle cx="96" cy="96" r="90" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <circle cx="96" cy="96" r="95" fill="none" stroke="#1E2831" stroke-width="1.4"/>
  </g>
</svg>
