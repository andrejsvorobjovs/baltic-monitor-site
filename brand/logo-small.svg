<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192"
     role="img" aria-label="Baltic Signal Monitor">
  <title>Baltic Signal Monitor</title>
  <!--
    Favicon cut, for 16-32px only.

    The full mark has four concentric rings 1.6-3px wide on a 192 canvas.
    At 16px that is under a quarter of a pixel each: they average together
    into a single grey smudge and the mark stops being recognisable. This
    version keeps only what survives the downscale — the disc, one sonar
    ring, and the gold fix — at weights that stay visible, and drops the
    sea silhouette, whose low-contrast detail is the first thing to
    disappear.

    Same palette, same off-centre target, so it still reads as the same
    logo sitting next to the full one in a bookmark list.
  -->
  <defs>
    <radialGradient id="badge" cx="50%" cy="44%" r="64%">
      <stop offset="0%"   stop-color="#1B2734"/>
      <stop offset="100%" stop-color="#0D131C"/>
    </radialGradient>
  </defs>

  <circle cx="96" cy="96" r="95.5" fill="url(#badge)"/>
  <!-- One ring, heavy enough to survive to 16px. -->
  <circle cx="100" cy="102" r="46" fill="none" stroke="#2C7877" stroke-width="11"/>
  <circle cx="100" cy="102" r="17" fill="#FAC873"/>
</svg>
